<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Mini App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --color-bg: #1CCFA9;
      --color-panel: #C6FF3F;
      --color-outline: #111111;
      --color-card: #FFFFFF;
      --color-accent-orange: #FF8A5B;
      --color-accent-purple: #B685FF;
      --color-accent-pink: #FF6E8E;
      --color-text: #111111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      background-color: var(--color-panel);
      border: 3px solid var(--color-outline);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 6px 6px 0px var(--color-outline);
    }

    h1 {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
    }

    .card {
      background-color: var(--color-card);
      border: 3px solid var(--color-outline);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0px var(--color-outline);
    }

    .card-title {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .rates-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .rate-box {
      background: var(--color-panel);
      border: 2px solid var(--color-outline);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }

    .rate-box .currency {
      font-weight: 900;
      font-size: 14px;
    }

    .rate-box .val {
      font-size: 15px;
      font-weight: 800;
      margin-top: 2px;
    }

    .convert-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .select-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input, select {
      padding: 10px;
      border: 2px solid var(--color-outline);
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      outline: none;
      background: #fff;
      width: 100%;
    }

    .btn-swap {
      background-color: var(--color-accent-purple);
      color: #fff;
      border: 2px solid var(--color-outline);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--color-outline);
      margin-top: 18px;
      transition: transform 0.1s;
    }

    .btn-swap:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px;
    }

    .result-text {
      font-size: 19px;
      font-weight: 900;
      margin-top: 6px;
      text-align: center;
      background: var(--color-panel);
      border: 2px solid var(--color-outline);
      border-radius: 12px;
      padding: 10px;
    }

    .error-msg {
      color: var(--color-accent-pink);
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      display: none;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>💱 Currency Mini App</h1>

    <div id="errorBanner" class="error-msg">⚠️ Не вдалося завантажити актуальні дані з сервера</div>

    <!-- Картка курсів -->
    <div class="card">
      <div class="card-title">Поточні курси НБУ (в UAH)</div>
      <div class="rates-grid">
        <div class="rate-box">
          <div class="currency">USD 💵</div>
          <div class="val" id="usd-rate">--.--</div>
        </div>
        <div class="rate-box">
          <div class="currency">EUR 💶</div>
          <div class="val" id="eur-rate">--.--</div>
        </div>
        <div class="rate-box">
          <div class="currency">PLN 🇵🇱</div>
          <div class="val" id="pln-rate">--.--</div>
        </div>
      </div>
    </div>

    <!-- Двосторонній мультивалютний конвертер -->
    <div class="card">
      <div class="card-title">Мультивалютний Конвертер</div>
      <div style="margin-bottom: 10px;">
        <label for="amountInput">Сума:</label>
        <input type="number" id="amountInput" placeholder="Введіть суму" value="100" min="0">
      </div>

      <div class="convert-row">
        <div class="select-group">
          <label for="fromSelect">З валюти:</label>
          <select id="fromSelect">
            <option value="USD">USD 💵</option>
            <option value="EUR">EUR 💶</option>
            <option value="PLN">PLN 🇵🇱</option>
            <option value="GBP">GBP 💷</option>
            <option value="CHF">CHF 🇨🇭</option>
            <option value="UAH" selected>UAH 🇺🇦</option>
          </select>
        </div>

        <button class="btn-swap" id="btnSwap" title="Поміняти місцями">⇄</button>

        <div class="select-group">
          <label for="toSelect">У валюту:</label>
          <select id="toSelect">
            <option value="USD" selected>USD 💵</option>
            <option value="EUR">EUR 💶</option>
            <option value="PLN">PLN 🇵🇱</option>
            <option value="GBP">GBP 💷</option>
            <option value="CHF">CHF 🇨🇭</option>
            <option value="UAH">UAH 🇺🇦</option>
          </select>
        </div>
      </div>

      <div class="result-text" id="calcResult">--.--</div>
    </div>

    <!-- Графік -->
    <div class="card">
      <div class="card-title" id="chartTitle">Динаміка курсів (30 днів)</div>
      <canvas id="rateChart" height="180"></canvas>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let rates = { UAH: 1.0 };
    let chartInstance = null;

    async function loadRates() {
      try {
        const res = await fetch('/api/rates');
        if (!res.ok) throw new Error("HTTP error " + res.status);
        rates = await res.json();

        document.getElementById('usd-rate').innerText = rates.USD ? rates.USD.toFixed(2) : "N/A";
        document.getElementById('eur-rate').innerText = rates.EUR ? rates.EUR.toFixed(2) : "N/A";
        document.getElementById('pln-rate').innerText = rates.PLN ? rates.PLN.toFixed(2) : "N/A";

        calculate();
      } catch (e) {
        console.error("Error loading rates:", e);
        document.getElementById('errorBanner').style.display = 'block';
      }
    }

    async function loadChartData(currency = 'USD') {
      try {
        const res = await fetch(`/api/history?currency=${currency}&days=30`);
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const result = await res.json();

        const labels = result.data.map(item => item.date.slice(5)); // MM-DD
        const chartRates = result.data.map(item => item.rate);

        renderChart(labels, chartRates, currency);
      } catch (e) {
        console.error("Error loading chart history:", e);
      }
    }

    function renderChart(labels, chartRates, currency) {
      const ctx = document.getElementById('rateChart').getContext('2d');
      document.getElementById('chartTitle').innerText = `Динаміка ${currency} (${labels.length} дн.)`;

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['Немає даних'],
          datasets: [{
            label: `Курс ${currency}`,
            data: chartRates.length ? chartRates : [0],
            borderColor: '#111111',
            borderWidth: 3,
            backgroundColor: '#FF8A5B',
            pointBackgroundColor: '#C6FF3F',
            pointRadius: 4,
            fill: false,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: '#e0e0e0' } }
          }
        }
      });
    }

    function calculate() {
      const amount = parseFloat(document.getElementById('amountInput').value) || 0;
      const fromCurr = document.getElementById('fromSelect').value;
      const toCurr = document.getElementById('toSelect').value;

      const fromRate = rates[fromCurr];
      const toRate = rates[toCurr];

      if (!fromRate || !toRate) {
        document.getElementById('calcResult').innerText = "Немає даних";
        return;
      }

      // Перерахунок через базову валюту UAH: Amount * RateFrom / RateTo
      const converted = (amount * fromRate) / toRate;
      document.getElementById('calcResult').innerText = `${converted.toLocaleString('uk-UA', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${toCurr}`;

      // Якщо у виборі є іноземна валюта, показуємо її графік
      const activeCurr = fromCurr !== 'UAH' ? fromCurr : (toCurr !== 'UAH' ? toCurr : 'USD');
      loadChartData(activeCurr);
    }

    // Реверс валют
    document.getElementById('btnSwap').addEventListener('click', () => {
      const fromSel = document.getElementById('fromSelect');
      const toSel = document.getElementById('toSelect');
      const temp = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value = temp;
      calculate();
    });

    document.getElementById('amountInput').addEventListener('input', calculate);
    document.getElementById('fromSelect').addEventListener('change', calculate);
    document.getElementById('toSelect').addEventListener('change', calculate);

    // Ініціалізація
    loadRates();
    loadChartData('USD');
  </script>
</body>
</html>
