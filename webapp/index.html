<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Mini App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --color-bg: #1CCFA9;
      --color-panel: #C6FF3F;
      --color-outline: #111111;
      --color-card: #FFFFFF;
      --color-accent-orange: #FF8A5B;
      --color-accent-purple: #B685FF;
      --color-accent-pink: #FF6E8E;
      --color-text: #111111;
      --color-text-muted: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      background-color: var(--color-panel);
      border: 3px solid var(--color-outline);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 6px 6px 0px var(--color-outline);
    }

    h1 {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
    }

    .card {
      background-color: var(--color-card);
      border: 3px solid var(--color-outline);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0px var(--color-outline);
    }

    .card-title {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .rates-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .rate-box {
      flex: 1;
      background: var(--color-panel);
      border: 2px solid var(--color-outline);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .rate-box .currency {
      font-weight: 900;
      font-size: 16px;
    }

    .rate-box .val {
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
    }

    .convert-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, select {
      padding: 10px;
      border: 2px solid var(--color-outline);
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      outline: none;
    }

    .result-text {
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
      text-align: center;
    }

    .error-msg {
      color: var(--color-accent-pink);
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>💱 Currency Mini App</h1>

    <div id="errorBanner" class="error-msg">⚠️ Не вдалося завантажити актуальні дані з сервера</div>

    <!-- Картка курсів -->
    <div class="card">
      <div class="card-title">Поточні курси НБУ</div>
      <div class="rates-row">
        <div class="rate-box">
          <div class="currency">USD</div>
          <div class="val" id="usd-rate">--.--</div>
        </div>
        <div class="rate-box">
          <div class="currency">EUR</div>
          <div class="val" id="eur-rate">--.--</div>
        </div>
      </div>
    </div>

    <!-- Графік -->
    <div class="card">
      <div class="card-title" id="chartTitle">Динаміка USD (30 днів)</div>
      <canvas id="rateChart" height="180"></canvas>
    </div>

    <!-- Конвертер -->
    <div class="card">
      <div class="card-title">Швидка конвертація</div>
      <div class="convert-form">
        <input type="number" id="amountInput" placeholder="Сума" value="100" min="0">
        <select id="currencySelect">
          <option value="USD">USD ➔ UAH</option>
          <option value="EUR">EUR ➔ UAH</option>
        </select>
        <div class="result-text" id="calcResult">-- UAH</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let usdRate = null;
    let eurRate = null;
    let chartInstance = null;

    async function loadRates() {
      try {
        const res = await fetch('/api/rates');
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();

        if (data.USD) usdRate = data.USD;
        if (data.EUR) eurRate = data.EUR;

        document.getElementById('usd-rate').innerText = usdRate ? usdRate.toFixed(2) + " UAH" : "N/A";
        document.getElementById('eur-rate').innerText = eurRate ? eurRate.toFixed(2) + " UAH" : "N/A";
        calculate();
      } catch (e) {
        console.error("Error loading rates:", e);
        document.getElementById('errorBanner').style.display = 'block';
      }
    }

    async function loadChartData(currency = 'USD') {
      try {
        const res = await fetch(`/api/history?currency=${currency}&days=30`);
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const result = await res.json();

        const labels = result.data.map(item => item.date.slice(5)); // MM-DD
        const rates = result.data.map(item => item.rate);

        renderChart(labels, rates, currency);
      } catch (e) {
        console.error("Error loading chart history:", e);
      }
    }

    function renderChart(labels, rates, currency) {
      const ctx = document.getElementById('rateChart').getContext('2d');
      document.getElementById('chartTitle').innerText = `Динаміка ${currency} (${labels.length} дн.)`;

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['Немає даних'],
          datasets: [{
            label: `Курс ${currency}`,
            data: rates.length ? rates : [0],
            borderColor: '#111111',
            borderWidth: 3,
            backgroundColor: '#FF8A5B',
            pointBackgroundColor: '#C6FF3F',
            pointRadius: 4,
            fill: false,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: '#e0e0e0' } }
          }
        }
      });
    }

    function calculate() {
      const amount = parseFloat(document.getElementById('amountInput').value) || 0;
      const curr = document.getElementById('currencySelect').value;
      const rate = curr === 'USD' ? usdRate : eurRate;

      if (!rate) {
        document.getElementById('calcResult').innerText = "Немає даних";
        return;
      }
      const res = amount * rate;
      document.getElementById('calcResult').innerText = `${res.toLocaleString('uk-UA', {minimumFractionDigits: 2, maximumFractionDigits: 2})} UAH`;
    }

    document.getElementById('amountInput').addEventListener('input', calculate);
    document.getElementById('currencySelect').addEventListener('change', (e) => {
      calculate();
      loadChartData(e.target.value);
    });

    // Початкове завантаження
    loadRates();
    loadChartData('USD');
  </script>
</body>
</html>
